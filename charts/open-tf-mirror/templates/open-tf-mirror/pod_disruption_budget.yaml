{{- $pdb := .Values.openTfMirror.pdb }}
{{- if and (hasKey $pdb "minAvailable") (hasKey $pdb "maxUnavailable") }}
{{- fail "openTfMirror.pdb.minAvailable and openTfMirror.pdb.maxUnavailable are mutually exclusive" }}
{{- end }}
{{- $replicas := int .Values.openTfMirror.replicas }}
{{- if and .Values.openTfMirror.pdb.enabled (gt $replicas 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "open-tf-mirror.name" . }}
  namespace: {{ include "open-tf-mirror.namespace" . }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "open-tf-mirror.labels" . | nindent 4 }}
spec:
  {{- if hasKey $pdb "minAvailable" }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else if hasKey $pdb "maxUnavailable" }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "open-tf-mirror.matchLabels" . | nindent 6 }}
{{- end }}
